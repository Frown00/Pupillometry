name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Lint and type-check
        run: npm run lint

      - name: Test
        run: npm test
